# ==========================================
# DEV PROFILE CONFIGURATION
# ==========================================
# This profile is meant for the Render deployment or any other dev environment.
# Activate it by setting environment variable: SPRING_PROFILES_ACTIVE=dev

# On Render, database properties (DB_USERNAME, DB_PASSWORD, DB_URL) will be
# loaded from the environment variables, so we don't need to hardcode them here.

# Hibernate/JPA
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Logging
logging.level.root=WARN
logging.level.org.springframework.web=INFO
logging.level.com.shoppingcart=INFO

# Disable Swagger / OpenAPI in production to save memory on Render Free Tier
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
