# ==========================================
# LOCAL PROFILE CONFIGURATION
# ==========================================
# This profile is active by default locally, or when SPRING_PROFILES_ACTIVE=local

# Local Database Configuration (TiDB)
# By default, this profile inherits the DB connection from application.properties (which uses environment variables).
# If you don't want to use environment variables locally, you can uncomment and paste your TiDB details here:
# spring.datasource.url=jdbc:mysql://your-tidb-host:4000/your_db_name?sslMode=VERIFY_IDENTITY&enabledTLSProtocols=TLSv1.2,TLSv1.3
# spring.datasource.username=your_tidb_username
# spring.datasource.password=your_tidb_password

# Hibernate/JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
