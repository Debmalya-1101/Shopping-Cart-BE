spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Set to true in production so refresh-token cookies are Secure + SameSite=None
app.production=${APP_PRODUCTION:false}

spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true

# JWT secret & expiry (example values – change the secret!)

app.jwt.secret=${JWT_SECRET:this_app_is_being_developed_by_@debmalya1101_Lives_in_$$$###}
# Access token TTL: 15 minutes (900 000 ms)
app.jwt.expiration-ms=900000
# Refresh token TTL: 7 days (604 800 000 ms)
app.jwt.refresh-expiration-ms=604800000

# Security debug (optional)
logging.level.org.springframework.security=INFO

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_replace_this}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:replace_this}

# ── OAuth2 Social Login ──────────────────────────────────────────────────────

# Google (OpenID Connect)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Facebook (OAuth2)
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# Facebook Graph API – explicitly request the fields we need (including picture)
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/me?fields=id,name,email,picture
spring.security.oauth2.client.provider.facebook.user-name-attribute=id

# Frontend URL where the browser is redirected after OAuth2 completes.
# Tokens are appended as query params: ?accessToken=...&refreshToken=...
app.oauth2.frontend-redirect-uri=${OAUTH2_REDIRECT_URI:http://localhost:4200/oauth2/callback}

# Hibernate Batch Fetching & JDBC Batching
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50

# HikariCP Connection Pool Optimization for TiDB / MySQL network latency
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true


# ── Gmail REST API (OAuth2) Configuration ────────────────────────────────────
# Replaces SMTP (blocked on Render free tier) with HTTP calls over port 443
gmail.oauth2.client-id=${GMAIL_CLIENT_ID}
gmail.oauth2.client-secret=${GMAIL_CLIENT_SECRET}
gmail.oauth2.refresh-token=${GMAIL_REFRESH_TOKEN}
gmail.oauth2.sender-email=nexis.store.vercel@gmail.com


# ── Actuator & Metrics ───────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.metrics.enabled=true
management.endpoint.prometheus.enabled=true
