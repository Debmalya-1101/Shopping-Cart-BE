
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway config
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.show-sql=true

# JWT secret & expiry (example values – change the secret!)

app.jwt.secret=${JWT_SECRET:this_app_is_being_developed_by_@debmalya1101_Lives_in_$$$###}
app.jwt.expiration-ms=86400000

# Security debug (optional)
logging.level.org.springframework.security=INFO

# Razorpay configuration
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_replace_this}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:replace_this}

# Hibernate Batch Fetching & JDBC Batching
spring.jpa.properties.hibernate.default_batch_fetch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_size=50

# HikariCP Connection Pool Optimization for TiDB / MySQL network latency
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.data-source-properties.cachePrepStmts=true
spring.datasource.hikari.data-source-properties.prepStmtCacheSize=250
spring.datasource.hikari.data-source-properties.prepStmtCacheSqlLimit=2048
spring.datasource.hikari.data-source-properties.useServerPrepStmts=true
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true
