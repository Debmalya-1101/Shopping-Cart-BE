name: Keep Backend Alive

on:
  schedule:
    # Runs every 14 minutes from 2 AM to 5 PM UTC (approx. 7:30 AM to 11:30 PM IST)
    - cron: '*/14 2-17 * * *'
  workflow_dispatch: # Allows you to manually trigger the ping from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          # Replace the URL below with your actual Render backend URL
          curl -I https://my-app-nexis-be.onrender.com/api/products || echo "Ping failed but continuing"
